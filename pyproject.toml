[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ut61e-ai-toolkit"
version = "0.1.0"
description = "UT61E+ measurements and checks for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
usb = ["hidapi>=0.14,<1"]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[project.scripts]
ut61e = "ut61e_toolkit.cli:main"
ut61e-mcp = "ut61e_toolkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

